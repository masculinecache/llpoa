reviews:
  profile: "assertive"
  path_filters:
    - "!**/node_modules/**"
    - "!**/*.lock"
    - "!**/package-lock.json"
    - "!**/bun.lockb"
  path_instructions:
    - path: "**/*"
      instructions: |
        Focus on Go + React + RAG security.
        Check search index handling and query sanitization.
        Verify embeddings API key handling is secure.
        Flag exposed secrets or insecure data retrieval patterns.
